name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install SDL3
        run: brew install sdl3
      - name: Generate MicroPython headers
        run: make embed
      - name: Build
        run: make -k -j3
      - name: Rebuild is a no-op
        run: make -q
      - name: Check
        run: make check
      - name: Package
        run: make dist
      - name: Packaged smoke test
        run: sh tools/dist_smoke.sh dist/sham-macos-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: sham-macos
          path: dist/*.zip
      - name: Build with Touchscreen Mode
        run: make -j3 TOUCHSCREEN=1

  linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libsdl3-dev python3 git ca-certificates zip unzip
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Generate MicroPython headers
        run: make embed
      - name: Build
        run: make -k -j4
      - name: Rebuild is a no-op
        run: make -q
      - name: Check
        run: make check
        env:
          SDL_VIDEO_DRIVER: dummy
      - name: Package
        run: make dist
      - name: Packaged smoke test
        run: sh tools/dist_smoke.sh dist/sham-linux-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: sham-linux
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            git
            python
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Generate MicroPython headers
        run: make embed
      - name: Build
        run: make -k -j4
      - name: Rebuild is a no-op
        run: make -q
      - name: Check
        run: make check
        env:
          SDL_VIDEO_DRIVER: dummy
      - name: Package
        run: make dist
      - name: Packaged smoke test
        run: >-
          cd dist/sham-windows-* &&
          mkdir -p smoke && printf '{"sound": false, "click": false}' > smoke/prefs.json &&
          PATH=/usr/bin SDL_VIDEO_DRIVER=dummy SDL_AUDIO_DRIVER=dummy ./sham.exe --no-watch --data=smoke --exec="host.sound(False); host.key_click(False)" --screenshot=smoke/screen.bmp --frames=5 &&
          test -s smoke/screen.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: sham-windows
          path: dist/*.zip
